# Fly.io app config for the FastAPI service. One app = one process on Fly,
# so the Celery worker is a SEPARATE app (deploy/worker/fly.toml) built from
# this same Dockerfile. Manual one-time setup (app create, secrets, first
# deploy): see deploy/README-fly.md.
#
# Deploy (from repo root): fly deploy --config fly.toml
app = "filingsage-api"

# Nearest Fly region to Mumbai. NOT verified live against `fly platform
# regions` — flyctl isn't available in this environment. Confirm before the
# first deploy; if "bom" isn't listed for your account, "sin" (Singapore) is
# the next-nearest fallback.
primary_region = "bom"

[build]
  # Dockerfile is at the repo root, same directory as this file — no
  # `dockerfile =` override needed (that's only required for the worker
  # app, whose fly.toml lives in a subdirectory).

[http_service]
  internal_port = 8000
  force_https = true

  # Always-on, not spin-down-on-idle. This is the entire reason we picked
  # Fly over other free-tier PaaS options that sleep idle apps: the cron
  # trigger and any live visitor must reach a warm process, not pay a cold
  # start. All three flags below are deliberate, not defaults.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

# Bumped from the free-tier default 256mb after a real OOM kill: `/qa`
# calling answer_question() loads FastEmbed's dense model (BGE-small,
# ~230MB resident on top of this process's own ~150MB+ import baseline —
# same model the worker needed 1GB for, decision #26) to embed the query
# text, in-process, on every request. `fly logs --no-tail` showed
# `Out of memory: Killed process ... (uvicorn)` the first time /qa actually
# ran end-to-end in production. 512mb, not the worker's 1GB: this process
# embeds ONE short query string per request, not a whole filing's worth of
# chunks — no EMBED_BATCH_SIZE-style batching concern here, so less
# headroom is needed. Revisit (with real fly logs evidence, not a guess) if
# OOM kills recur here.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
