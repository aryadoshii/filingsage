[project]
name = "filingsage"
version = "0.1.0"
description = "An AI research analyst that watches your companies and reads every new SEC filing the moment it drops."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "selectolax>=0.3",
    "pyarrow>=17",
    "duckdb>=1.1",
    # ONNX-based dense+sparse embeddings (BGE-small + BM25-family), not full
    # PyTorch — fits the 512MB Fly worker (README → Technical Decisions #23).
    # Needed now for its tokenizer (gold/chunking.py token counting must
    # match the embedding model's real context window); the embedder itself
    # lands in increment 2. One lib covers both, so it's one dependency, not two.
    "fastembed>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running Docker daemon (testcontainers)"]