[project]
name = "filingsage"
version = "0.1.0"
description = "An AI research analyst that watches your companies and reads every new SEC filing the moment it drops."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "selectolax>=0.3",
    "pyarrow>=17",
    "duckdb>=1.1",
    # ONNX-based dense+sparse embeddings (BGE-small + BM25-family), not full
    # PyTorch — fits the 512MB Fly worker (README → Technical Decisions #23).
    # Used for both its tokenizer (gold/chunking.py token counting, so chunk
    # boundaries match the embedding model's real context window) and the
    # actual dense+sparse embedding calls (gold/embedding.py). One lib
    # covers both, so it's one dependency, not two.
    "fastembed>=0.8",
    # Official Qdrant client — typed models for the hybrid (named dense +
    # sparse vector) collection API used in gold/vector_store.py, and one
    # client that works identically against local/in-memory Qdrant (tests)
    # and Qdrant Cloud (prod) with just a different URL.
    "qdrant-client>=1.13",
    # Groq's official client — cited Q&A's primary LLM provider
    # (gold/qa.py), free/fast Llama inference with a JSON-mode chat
    # completions API.
    "groq>=1.6",
    # Google's current unified GenAI SDK — cited Q&A's fallback provider
    # (Gemini Flash). Chosen over the older google-generativeai package
    # because it takes a Pydantic model directly as response_schema and
    # hands back an already-validated object (response.parsed), rather than
    # us hand-parsing JSON for this provider too.
    "google-genai>=2.14",
    # Fetches + caches the chunking tokenizer's tokenizer.json under HF_HOME
    # (gold/chunking.py), so the Dockerfile can bake it into the image. Not
    # a new install — fastembed and tokenizers already depend on it — but
    # declared because we now import it directly.
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "ui"]

[tool.ruff.lint]
# Pinned explicitly: with no `select`, the rule set silently changes whenever
# ruff's own defaults do (ruff 0.16 began flagging ~16 new things here with
# zero code changes). These are ruff's long-standing defaults (pyflakes +
# the error-class pycodestyle rules) plus import sorting.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ui/ is a separate app (its own image and requirements), not part of the
# installed package; this lets tests import its framework-free modules.
pythonpath = ["ui"]
markers = ["integration: requires a running Docker daemon (testcontainers)"]
filterwarnings = [
    # Tests use qdrant-client's in-memory local mode, which accepts
    # create_payload_index() as a no-op and warns on every call. Real
    # (server) Qdrant builds the indexes; test_vector_store.py checks the
    # calls themselves with a spy client.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]