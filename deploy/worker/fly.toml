# Fly.io app config for the Celery worker. Same Dockerfile as the API app
# (../api/fly.toml), different Fly app and a command override — Fly's model
# is one app = one process, so "API + worker from one image" means two
# separate `fly apps create` + two fly.toml files, not one app with two
# processes. Manual one-time setup: see ../README-fly.md.
#
# Deploy (from repo root): fly deploy --config deploy/worker/fly.toml
app = "filingsage-worker"

# NOT the same region as the api app (bom/Mumbai) — bom's Always Free
# capacity turned out to be constrained specifically for volume-attached
# machines (this app mounts a Fly Volume for /app/data, below), even though
# the api app deploys there fine without one. sin (Singapore) is the
# fallback that had capacity. See README.md → Technical Decisions #21.
primary_region = "sin"

# A worker app has no [http_service], so Fly's proxy-driven auto-stop/start
# (the mechanism that reacts to HTTP traffic) doesn't apply to it in the
# first place — but a sleeping worker never drains the queue, so these are
# set explicitly rather than left to whatever Fly's default for a
# service-less app happens to be.
auto_stop_machines = false
auto_start_machines = false
min_machines_running = 1

[build]
  # Path is relative to THIS file's directory (deploy/worker/), resolving to
  # the shared repo-root Dockerfile. flyctl uses that Dockerfile's directory
  # (the repo root) as the build context — required, since the Dockerfile
  # COPYs pyproject.toml and src/ from there.
  dockerfile = "../../Dockerfile"

# Overrides the image's default CMD (uvicorn) to run the Celery worker
# instead. concurrency=1, not the dev stack's 2 — sized for this app's
# memory ceiling (see [[vm]] below). --without-gossip/--without-mingle:
# peer-discovery/sync features for MULTI-worker deployments — pure
# overhead for this single always-on worker with no peers, and part of
# the Redis command volume that exhausted Upstash's free tier (README →
# Technical Decisions #25). Doesn't affect `celery inspect ping` or task
# dispatch, which use a separate control mechanism.
[processes]
  app = "celery -A filingsage.worker.celery_app:celery_app worker --loglevel=INFO --concurrency=1 --without-gossip --without-mingle"

# Bronze/silver land on local disk until the R2 increment (same as
# docker-compose.prod.yml's named volume) — a Fly Volume, not the
# ephemeral machine disk, so a redeploy or machine replacement doesn't lose
# already-fetched filings. Requires a one-time `fly volumes create`; see
# ../README-fly.md.
[[mounts]]
  source = "data"
  destination = "/app/data"

# 1GB (README → Technical Decisions #26). This process loads a real ONNX
# transformer (BGE-small dense) in-memory alongside the Celery/SQLAlchemy/
# pyarrow/duckdb stack; measured peak during embedding is comfortably under
# this but not under 512MB, which is why it's 1GB and not less.
#
# IMPORTANT: this file is the source of truth applied on every `fly
# deploy` — a memory bump made via `fly scale` outside of a deploy gets
# silently reset to whatever's committed here the next time someone
# deploys. If you scale this live, update this file in the same breath, or
# the next deploy undoes it (this happened at least once — see decision #26).
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
