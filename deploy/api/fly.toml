# Fly.io app config for the FastAPI service. One app = one process on Fly,
# so the Celery worker is a SEPARATE app (deploy/worker/fly.toml) built from
# this same Dockerfile. Manual one-time setup (app create, secrets, first
# deploy): see deploy/README-fly.md.
#
# Deploy (from repo root): fly deploy --config deploy/api/fly.toml
app = "filingsage-api"

# Nearest Fly region to Mumbai. NOT verified live against `fly platform
# regions` — flyctl isn't available in this environment. Confirm before the
# first deploy; if "bom" isn't listed for your account, "sin" (Singapore) is
# the next-nearest fallback.
primary_region = "bom"

[build]
  # Path is relative to THIS file's directory (deploy/api/), resolving to
  # the shared repo-root Dockerfile — same pattern as deploy/worker/fly.toml.
  # flyctl uses that Dockerfile's directory (the repo root) as the build
  # context, required since the Dockerfile COPYs pyproject.toml and src/
  # from there.
  dockerfile = "../../Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true

  # Always-on, not spin-down-on-idle. This is the entire reason we picked
  # Fly over other free-tier PaaS options that sleep idle apps: the cron
  # trigger and any live visitor must reach a warm process, not pay a cold
  # start. All three flags below are deliberate, not defaults.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

# Bumped again, 512mb -> 1gb (now matching the worker), for the reranker
# (README → Technical Decisions #29): /qa's answer_question() now also
# loads a cross-encoder (Xenova/ms-marco-MiniLM-L-6-v2, measured ~280MB —
# model load plus one rerank call, gold/rerank.py) in-process, on top of
# the dense query-embedding model this process already loads (the ~230MB
# that justified the previous 256mb -> 512mb bump). Matching the worker's
# 1gb outright rather than incrementally re-bumping a second time: this
# process now also runs two ONNX models concurrently resident, the same
# shape of workload the worker was originally sized for.
#
# IMPORTANT: this file is the source of truth applied on every `fly
# deploy` — a memory bump made via `fly scale` outside of a deploy gets
# silently reset to whatever's committed here the next time someone
# deploys (this happened once already on the worker app — decision #26).
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
