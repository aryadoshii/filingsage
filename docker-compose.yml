name: filingsage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filingsage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filingsage}
      POSTGRES_DB: ${POSTGRES_DB:-filingsage}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-filingsage} -d ${POSTGRES_DB:-filingsage}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local vector store — replaces Qdrant Cloud for the localhost stack
  # (Technical Decisions #30). Pinned to the server minor matching the
  # qdrant-client this repo is tested with; qdrant-client warns when client
  # and server minors drift apart. REST only (6333) — the app never uses gRPC.
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"           # REST API + built-in web UI at /dashboard
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The Qdrant image ships without curl/wget, so probe the port with
      # bash's /dev/tcp instead: "is the REST server accepting connections".
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies Alembic migrations, then exits 0. api and worker wait
  # for it (service_completed_successfully), so a fresh `docker compose up`
  # never serves requests against a database with no tables — the gap that
  # caused a real UndefinedTable error in production (Technical Decisions #22).
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://filingsage:filingsage@postgres:5432/filingsage
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./migrations:/app/migrations   # new migration files apply without a rebuild
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file: .env
    # .env's DATABASE_URL/REDIS_URL are host-facing (localhost:5432/6379, for
    # `python -m filingsage.cli` run on the Mac). Inside a container,
    # `localhost` is the container itself — these overrides point at the
    # in-network service names instead. `environment:` wins over `env_file`.
    environment:
      DATABASE_URL: postgresql+psycopg://filingsage:filingsage@postgres:5432/filingsage
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""      # local Qdrant has no auth; never send a cloud key to it
    command: ["uvicorn", "filingsage.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src        # dev bind mount: edit on host, --reload picks it up
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: .
    env_file: .env
    # Same container-vs-host URL fix as api (see comment there).
    environment:
      DATABASE_URL: postgresql+psycopg://filingsage:filingsage@postgres:5432/filingsage
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""      # local Qdrant has no auth; never send a cloud key to it
    # --without-gossip/--without-mingle: both are peer-discovery/sync
    # features for MULTI-worker deployments (gossip continuously
    # pubsub-announces this worker to others via the broker; mingle
    # syncs state with other workers at startup) — pure overhead for a
    # single always-on worker with no peers, and part of the Redis
    # command volume that exhausted Upstash's free tier (README →
    # Technical Decisions #25). Does not affect `celery inspect ping`
    # (below) or task dispatch — those use a separate control mechanism.
    command: ["celery", "-A", "filingsage.worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "--without-gossip", "--without-mingle"]
    volumes:
      - ./src:/app/src
      - ./data:/app/data      # bronze/silver land here — host-visible, matches CLI's local run
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A filingsage.worker.celery_app:celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Scheduler: enqueues filingsage.scheduled_ingest every 2h (celery_app.py
  # beat_schedule) — the localhost replacement for the GitHub Actions cron
  # (Technical Decisions #31). Exactly ONE beat process may run: two would
  # enqueue every scheduled run twice. It only publishes messages; the
  # worker above does the work. The schedule state file lives in /tmp —
  # throwaway, so a restart simply recomputes the next :17-past-even-hour.
  beat:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://filingsage:filingsage@postgres:5432/filingsage
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "filingsage.worker.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    volumes:
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy

  # The dashboard (decision #32): Streamlit at http://localhost:8501. A pure
  # HTTP client of the API — it gets only the two settings it needs, not the
  # whole .env, so no LLM or database credentials ever reach this container.
  # INGEST_TOKEN lets the "Track a company" form call /internal/ingest; it's
  # used server-side by Streamlit and never sent to the browser.
  ui:
    build: ./ui
    environment:
      API_URL: http://api:8000
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/app             # edit on host; runOnSave re-runs the app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  qdrant_data:
