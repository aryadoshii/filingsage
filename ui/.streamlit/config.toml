[server]
headless = true
# Re-run the app when a file under ui/ changes (bind-mounted in Compose).
runOnSave = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Visual identity: an annotated annual report. White paper, ink text, a
# dark masthead band per page, teal for actions, and a highlighter yellow
# reserved for one thing only — the exact filing text an answer cites (see
# filingsage_ui/components.py's stylesheet for the full token list).
[theme]
base = "light"
primaryColor = "#0F6E8C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5F7"
textColor = "#102231"
linkColor = "#0F6E8C"
borderColor = "#DDE2E9"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap, serif"
headingFontWeights = [600, 600, 500]
baseRadius = "6px"
greenColor = "#1E7A4C"
orangeColor = "#A86B12"
redColor = "#B23B2E"
