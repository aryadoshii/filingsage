# Triggers the ingestion pipeline every 2h by hitting the deployed API's
# internal endpoint — no checkout, no Python, no repo code runs here. The
# cron's only credential is one revocable token (INGEST_TOKEN), and the
# Celery/Redis queue stays an internal detail the workflow never touches.
# Safe to re-run any time: ingest_watchlist's ON CONFLICT dedupe gate makes
# a repeat run against already-seen filings a no-op.
#
# Requires repo secrets:
#   INGEST_URL   — base URL of the deployed API. On Fly.io this is the
#                  app's own domain (e.g. https://filingsage-api.fly.dev),
#                  set once the app exists — see deploy/README-fly.md.
#   INGEST_TOKEN — must match the INGEST_TOKEN secret set on the
#                  filingsage-api Fly app (fly secrets set, same README)
#
# SCHEDULE DISABLED (Technical Decisions #31): the hosted API is paused and
# FilingSage runs localhost-first, where Celery beat owns the 2h schedule —
# a GitHub-hosted runner can't reach an API on localhost, so the scheduled
# run only failed every 2 hours. Kept as manual-dispatch so a future hosted
# deployment can restore the schedule by re-adding the block below:
#
#   schedule:
#     # :17 past every even hour, not :00 — GitHub delays jobs scheduled at
#     # :00 under platform load, since that's when everyone else's cron fires.
#     - cron: "17 */2 * * *"
name: ingest-cron

on:
  workflow_dispatch: {}

jobs:
  trigger-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: POST /internal/ingest
        run: |
          curl -sf -X POST "${{ secrets.INGEST_URL }}/internal/ingest" \
            -H "X-Ingest-Token: ${{ secrets.INGEST_TOKEN }}"
